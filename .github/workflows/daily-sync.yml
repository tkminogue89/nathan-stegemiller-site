name: Daily site sync

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily (~6am ET)
  workflow_dispatch: {}      # allows manual runs

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install --quiet pillow pillow-heif

      - name: Sync from sheet and rebuild
        run: python3 sync_build.py

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "site-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Daily sync from inventory sheet [skip ci]"
            git push
            echo "Pushed changes."
          else
            echo "No changes to publish."
          fi
